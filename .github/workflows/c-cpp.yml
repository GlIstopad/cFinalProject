name: C CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. This replaces the manual curl install and sourcing
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # 2. Use 'nix develop' to run your commands inside the Nix environment
      - name: Build and Test
        run: |
          nix develop --command bash -c "
            export CC=${{ matrix.compiler }}
            
            # Configure
            if [ -f CMakeLists.txt ]; then
              cmake -B build -S . -DCMAKE_C_COMPILER=\$CC -DCMAKE_BUILD_TYPE=Debug
            fi

            # Build
            if [ -f build/Makefile ] || [ -f build/build.ninja ]; then
              cmake --build build --config Debug -- -j\$(nproc)
            elif [ -f Makefile ]; then
              make
            fi

            # Test
            if [ -d build ] && [ -f CMakeLists.txt ]; then
              cd build && ctest --output-on-failure
            elif make -n test >/dev/null 2>&1; then
              make test
            fi
          "
